<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dang nhap</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-shell">
    <div class="auth-panel">
        <div class="auth-brand">
            <p class="auth-brand-title">BADMINTON COURT</p>
            <p class="auth-brand-sub">Booking</p>
        </div>

        <main class="auth-card">
            <h1 class="auth-title">Đăng nhập</h1>
            <p th:if="${param.error}" class="alert alert-error">Email hoac mat khau khong dung.</p>
            <p th:if="${param.logout}" class="alert alert-success">Dang xuat thanh cong.</p>
            <p th:if="${successMessage}" th:text="${successMessage}" class="alert alert-success"></p>
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-error"></p>

            <form th:action="@{/auth/login}" method="post">
                <div>
                    <label>Email (*)</label>
                    <input type="email" name="email" placeholder="Nhập email của bạn (*)" autocomplete="email" required>
                </div>
                <div>
                    <label>Mật khẩu (*)</label>
                    <input type="password" name="password" placeholder="Nhập mật khẩu (*)" autocomplete="current-password" required>
                </div>
                <button class="auth-submit" type="submit">Đăng nhập</button>
            </form>
            <p class="auth-footer">
                Bạn chưa có tài khoản? <a th:href="@{/auth/register}"><b>Đăng ký</b></p>
            </p>
        </main>
    </div>
</div>
</body>
</html>
