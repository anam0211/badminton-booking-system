<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
<div th:replace="~{fragments/header :: appHeader}"></div>

<main class="password-page">
    <section class="password-header">
        <h1 class="password-title">Đổi mật khẩu</h1>
        <p class="password-subtitle">Đặt mật khẩu mới để bảo mật tài khoản của bạn.</p>
    </section>

    <article class="password-card">
        <p th:if="${successMessage}" th:text="${successMessage}" class="alert alert-success"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-error"></p>
        <p th:if="${#fields.hasGlobalErrors()}" class="alert alert-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

        <form th:action="@{/user/change-password}" th:object="${passwordForm}" method="post" class="password-form">
            <div>
                <label>Mật khẩu hiện tại</label>
                <input type="password" th:field="*{currentPassword}" required autocomplete="current-password">
                <small class="alert alert-error" th:errors="*{currentPassword}"></small>
            </div>
            <div>
                <label>Mật khẩu mới</label>
                <input type="password" th:field="*{newPassword}" required autocomplete="new-password">
                <small class="alert alert-error" th:errors="*{newPassword}"></small>
            </div>
            <div>
                <label>Nhập lại mật khẩu mới</label>
                <input type="password" th:field="*{confirmNewPassword}" required autocomplete="new-password">
                <small class="alert alert-error" th:errors="*{confirmNewPassword}"></small>
            </div>
            <button class="password-submit" type="submit">Cập nhật mật khẩu</button>
        </form>
    </article>
</main>
</body>
</html>
