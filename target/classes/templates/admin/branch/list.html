<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chi nhánh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .status-badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .status-open { background: #dcfce7; color: #166534; }
        .status-closed { background: #fee2e2; color: #991b1b; }
        .status-maintenance { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

<aside id="sidebar" th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></aside>

<main class="flex-1 overflow-y-auto p-8 relative z-10">
    <div class="max-w-7xl mx-auto space-y-6">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Quản lý Chi nhánh</h1>
                <p class="text-sm text-gray-500 mt-1">Quản lý danh sách các chi nhánh cơ sở cầu lông</p>
            </div>
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/branches/create}"
                   class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition text-sm font-medium">
                    <i class="fas fa-plus"></i> Thêm chi nhánh
                </a>
            </div>
        </div>

        <div th:if="${successMessage}" class="px-4 py-3 rounded-lg bg-emerald-100 text-emerald-800 text-sm flex items-center gap-2">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="px-4 py-3 rounded-lg bg-red-100 text-red-700 text-sm flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100">
                <form th:action="@{/admin/branches}" method="get" class="flex flex-wrap items-end gap-3">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Tìm kiếm</label>
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tên chi nhánh..."
                               class="w-full h-9 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
                    </div>
                    <div class="w-40">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Khu vực</label>
                        <select name="areaId" class="w-full h-9 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
                            <option value="">Tất cả</option>
                            <option th:each="area : ${areas}" th:value="${area.id}" th:text="${area.name}"
                                    th:selected="${selectedArea != null and selectedArea == area.id}"></option>
                        </select>
                    </div>
                    <div class="w-36">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Trạng thái</label>
                        <select name="status" class="w-full h-9 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
                            <option value="">Tất cả</option>
                            <option th:each="s : ${statusOptions}" th:value="${s.name()}" th:text="${s.name()}"
                                    th:selected="${selectedStatus != null and selectedStatus == s.name()}"></option>
                        </select>
                    </div>
                    <button type="submit" class="h-9 px-4 bg-emerald-600 text-white rounded-lg text-sm hover:bg-emerald-700 transition">
                        <i class="fas fa-search mr-1"></i> Tìm
                    </button>
                    <a th:href="@{/admin/branches}" class="h-9 px-4 border border-gray-300 text-gray-600 rounded-lg text-sm hover:bg-gray-50 transition flex items-center">
                        <i class="fas fa-times mr-1"></i> Reset
                    </a>
                </form>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full min-w-[900px] text-sm">
                    <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="text-left px-6 py-3 font-semibold">ID</th>
                        <th class="text-left px-6 py-3 font-semibold">Chi nhánh</th>
                        <th class="text-left px-6 py-3 font-semibold">Khu vực</th>
                        <th class="text-left px-6 py-3 font-semibold">Trạng thái</th>
                        <th class="text-left px-6 py-3 font-semibold">Đánh giá</th>
                        <th class="text-left px-6 py-3 font-semibold">Hình ảnh</th>
                        <th class="text-left px-6 py-3 font-semibold">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="b : ${branches}" class="border-t border-gray-100 hover:bg-gray-50">
                        <td class="px-6 py-4 text-gray-700 font-medium" th:text="${b.id}">1</td>
                        <td class="px-6 py-4">
                            <div class="font-medium text-gray-900" th:text="${b.name}">Chi nhánh 1</div>
                            <div class="text-xs text-gray-500 truncate max-w-[200px]" th:text="${b.address}">Địa chỉ</div>
                        </td>
                        <td class="px-6 py-4 text-gray-700" th:text="${b.areaName}">Ba Đình</td>
                        <td class="px-6 py-4">
                            <span class="status-badge"
                                  th:classappend="${b.status == 'OPEN' ? 'status-open' : (b.status == 'CLOSED' ? 'status-closed' : 'status-maintenance')}"
                                  th:text="${b.status}">OPEN</span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-1 text-yellow-500">
                                <i class="fas fa-star text-xs"></i>
                                <span class="text-gray-700 font-medium" th:text="${b.averageRating != null ? b.averageRating : '0.0'}">4.5</span>
                                <span class="text-gray-400 text-xs" th:text="'(' + ${b.totalReviews != null ? b.totalReviews : 0} + ')'">(10)</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center gap-1 text-gray-600">
                                <i class="fas fa-images text-xs"></i>
                                <span th:text="${b.imageCount != null ? b.imageCount : 0}">3</span>
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2">
                                <a th:href="@{/admin/branches/detail/{id}(id=${b.id})}"
                                   class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition" title="Xem chi tiết">
                                    <i class="fas fa-eye text-xs"></i>
                                </a>
                                <a th:href="@{/admin/branches/edit/{id}(id=${b.id})}"
                                   class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition" title="Sửa">
                                    <i class="fas fa-edit text-xs"></i>
                                </a>
                                <form th:action="@{/admin/branches/toggle-status/{id}(id=${b.id})}" method="post" class="inline">
                                    <button type="submit"
                                            class="inline-flex items-center justify-center w-8 h-8 rounded-lg transition"
                                            th:classappend="${b.status == 'OPEN' ? 'bg-orange-50 text-orange-600 hover:bg-orange-100' : 'bg-green-50 text-green-600 hover:bg-green-100'}"
                                            th:title="${b.status == 'OPEN' ? 'Đóng chi nhánh' : 'Mở chi nhánh'}">
                                        <i class="fas text-xs" th:classappend="${b.status == 'OPEN' ? 'fa-ban' : 'fa-play'}"></i>
                                    </button>
                                </form>
                                <form th:action="@{/admin/branches/delete/{id}(id=${b.id})}" method="post" class="inline"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa chi nhánh này?');">
                                    <button type="submit"
                                            class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition" title="Xóa">
                                        <i class="fas fa-trash text-xs"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(branches)}">
                        <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                            <div class="flex flex-col items-center gap-3">
                                <i class="fas fa-building text-4xl text-gray-300"></i>
                                <p>Chưa có chi nhánh nào.</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="px-6 py-3 border-t border-gray-100 flex items-center justify-between" th:if="${branchPage != null and branchPage.totalPages > 1}">
                <p class="text-sm text-gray-500">
                    Hiển thị <span th:text="${branchPage.number * branchPage.size + 1}">1</span>
                    - <span th:text="${branchPage.number * branchPage.size + branches.size()}">10</span>
                    trong <span th:text="${branchPage.totalElements}">50</span> chi nhánh
                </p>
                <div class="flex items-center gap-1">
                    <a th:if="${!branchPage.first}"
                       th:href="@{/admin/branches(keyword=${keyword}, areaId=${selectedArea}, status=${selectedStatus}, page=${branchPage.number - 1})}"
                       class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                        <i class="fas fa-chevron-left text-xs"></i>
                    </a>
                    <a th:each="i : ${#numbers.sequence(0, branchPage.totalPages - 1)}"
                       th:if="${branchPage.totalPages <= 7 or (i >= branchPage.number - 1 and i <= branchPage.number + 3) or i == 0 or i == branchPage.totalPages - 1}"
                       th:href="@{/admin/branches(keyword=${keyword}, areaId=${selectedArea}, status=${selectedStatus}, page=${i})}"
                       class="w-8 h-8 flex items-center justify-center rounded-lg border text-sm transition"
                       th:classappend="${branchPage.number == i ? 'bg-emerald-600 text-white border-emerald-600' : 'border-gray-300 text-gray-600 hover:bg-gray-50'}"
                       th:text="${i + 1}">1</a>
                    <a th:if="${!branchPage.last}"
                       th:href="@{/admin/branches(keyword=${keyword}, areaId=${selectedArea}, status=${selectedStatus}, page=${branchPage.number + 1})}"
                       class="w-8 h-8 flex items-center justify-center rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
