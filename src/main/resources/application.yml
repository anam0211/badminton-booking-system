spring:
  application:
    name: badminton-booking

  profiles:
    active: prod

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    check-template-location: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
    org.thymeleaf: DEBUG

app:
  security:
    jwt:
      # Base64 secret, can be overridden by env/config.
      secret: YmFkbWludG9uLWJvb2tpbmctand0LXNlY3JldC1rZXktZm9yLWRldg==
      expiration-ms: 86400000