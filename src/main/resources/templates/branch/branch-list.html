<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head_info('Danh sách cơ sở | Badminton', '/css/branch-list.css')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container main-content">

    <div class="search-result-info">
        <h2>Danh sách cơ sở cầu lông</h2>
        <a th:href="@{/branches}" class="btn-clear-all"
           th:if="${param.keyword != null or param.district != null or param.priceRange != null or param.rating != null}">
            Xóa tất cả điều kiện
        </a>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(branchList)}">
        <img src="https://cdn-icons-png.flaticon.com/512/7486/7486744.png" alt="No data">
        <h3>Rất tiếc, không tìm thấy cơ sở nào!</h3>
        <p>Vui lòng thử lại với các tiêu chí tìm kiếm hoặc bộ lọc khác.</p>
    </div>

    <div class="branch-grid" th:unless="${#lists.isEmpty(branchList)}">

        <div class="branch-card" th:each="branch : ${branchList}"
             style="cursor: pointer;"
             th:onclick="|window.location.href='@{/branches/{id}(id=${branch.branchId})}'|">

            <img th:src="${branch.branchImage != null ? ((#strings.startsWith(branch.branchImage, 'http://') or #strings.startsWith(branch.branchImage, 'https://')) ? branch.branchImage : '/uploads/' + branch.branchImage) : 'https://cdn-icons-png.flaticon.com/512/7486/7486744.png'}"
                 alt="Branch Image">

            <div class="card-info">
                <h3 th:text="${branch.branchName}">Tên cơ sở</h3>

                <p style="font-size: 0.85rem; color: #666; margin: 5px 0;">
                    <i class="fas fa-map-marker-alt"></i> <span th:text="${branch.address}">Địa chỉ</span>
                </p>

                <div class="rating">
                    <i class="fas fa-star" style="color: #ffc107;"></i>
                    <span style="font-weight: bold; color: #333;"
                          th:text="${branch.avgRating != null ? branch.avgRating : '5.0'}">4.5</span>
                    <span style="font-size: 0.8rem; color: #888;"
                          th:text="'(' + ${branch.totalReviews != null ? branch.totalReviews : 0} + ' đánh giá)'">(0 đánh giá)</span>
                </div>

                <div class="card-footer" style="margin-top: 15px;">
                    <span class="price" style="font-weight: 500; color: #e74c3c;"
                          th:if="${branch.minPrice != null}"
                          th:text="'Từ ' + ${#numbers.formatDecimal(branch.minPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">Từ 50,000 đ</span>
                    <span class="price" style="font-weight: 500; color: #e74c3c;"
                          th:if="${branch.minPrice == null}">Liên hệ</span>

                    <a th:href="@{/bookings/create(branchId=${branch.branchId})}"
                       class="btn-booking"
                       onclick="event.stopPropagation()">Đặt sân</a>
                </div>
            </div>

        </div>

    </div>

    <div class="pagination" th:if="${branchPage != null and branchPage.totalPages > 1}">
        <ul>
            <li th:classappend="${branchPage.first} ? 'disabled'">
                <a th:href="@{/branches(keyword=${param.keyword}, district=${param.district}, priceRange=${param.priceRange}, rating=${param.rating}, page=${branchPage.number - 1})}">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, branchPage.totalPages - 1)}"
                th:classappend="${branchPage.number == i} ? 'active'">
                <a th:href="@{/branches(keyword=${param.keyword}, district=${param.district}, priceRange=${param.priceRange}, rating=${param.rating}, page=${i})}"
                   th:text="${i + 1}">1</a>
            </li>

            <li th:classappend="${branchPage.last} ? 'disabled'">
                <a th:href="@{/branches(keyword=${param.keyword}, district=${param.district}, priceRange=${param.priceRange}, rating=${param.rating}, page=${branchPage.number + 1})}">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        </ul>
    </div>

</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
