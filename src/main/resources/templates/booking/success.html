<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt sân thành công</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 32px; background: #f7f7f7; }
        .card { background: white; padding: 24px; border-radius: 12px; max-width: 980px; margin: auto; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f1f1f1; }
        .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 16px; }
        .box { background: #f9f9f9; border-radius: 10px; padding: 16px; }
        .actions { margin-top: 16px; }
        a { text-decoration: none; padding: 10px 16px; border-radius: 8px; background: #0d6efd; color: white; display: inline-block; }
    </style>
</head>
<body>
<div class="card">
    <h1>Đặt sân thành công</h1>

    <div class="summary">
        <div class="box"><strong>Mã booking:</strong> <span th:text="${booking.id}"></span></div>
        <div class="box"><strong>Trạng thái:</strong> <span th:text="${booking.status}"></span></div>
        <div class="box"><strong>Thanh toán:</strong> <span th:text="${booking.paymentStatus}"></span></div>
        <div class="box"><strong>Tổng tiền:</strong> <span th:text="${booking.totalAmount}"></span></div>
        <div class="box"><strong>Ngày đặt:</strong> <span th:text="${booking.bookingDate}"></span></div>
        <div class="box"><strong>Ghi chú:</strong> <span th:text="${booking.note}"></span></div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Sân</th>
            <th>Khung giờ</th>
            <th>Ngày chơi</th>
            <th>Giá</th>
            <th>Trạng thái slot</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${booking.items}">
            <td th:text="${item.courtName}"></td>
            <td th:text="${item.startTime + ' - ' + item.endTime}"></td>
            <td th:text="${item.playDate}"></td>
            <td th:text="${item.price}"></td>
            <td th:text="${item.active == 1 ? 'Đang giữ chỗ' : 'Đã hủy'}"></td>
        </tr>
        </tbody>
    </table>

    <div class="actions">
        <a th:href="@{/bookings/create(userId=1)}">Tạo booking mới</a>
    </div>
</div>
</body>
</html>
