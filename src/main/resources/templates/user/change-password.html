<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doi mat khau</title>
</head>
<body>
<div th:replace="~{fragments/header :: appHeader}"></div>

<main style="max-width:480px;margin:24px auto;">
    <h1>Doi mat khau</h1>
    <p th:if="${successMessage}" th:text="${successMessage}" style="color:green;"></p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
    <p th:if="${#fields.hasGlobalErrors()}" style="color:red;" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

    <form th:action="@{/user/change-password}" th:object="${passwordForm}" method="post">
        <div>
            <label>Mat khau hien tai</label>
            <input type="password" th:field="*{currentPassword}" required>
            <small style="color:red;" th:errors="*{currentPassword}"></small>
        </div>
        <div style="margin-top:8px;">
            <label>Mat khau moi</label>
            <input type="password" th:field="*{newPassword}" required>
            <small style="color:red;" th:errors="*{newPassword}"></small>
        </div>
        <button style="margin-top:12px;" type="submit">Doi mat khau</button>
    </form>
</main>
</body>
</html>
