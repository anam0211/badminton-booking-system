<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>
<div th:replace="~{fragments/header :: appHeader}"></div>

<main style="max-width:560px;margin:24px auto;">
    <h1>Thong tin profile</h1>
    <p th:if="${successMessage}" th:text="${successMessage}" style="color:green;"></p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
    <p th:if="${#fields.hasGlobalErrors()}" style="color:red;" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

    <p><strong>Email:</strong> <span th:text="${currentUserDetail.email}">email</span></p>
    <p><strong>Role:</strong> <span th:text="${currentUserDetail.role.name}">role</span></p>

    <form th:action="@{/user/profile}" th:object="${profileForm}" method="post">
        <div>
            <label>Ho ten</label>
            <input type="text" th:field="*{fullName}" required>
            <small style="color:red;" th:errors="*{fullName}"></small>
        </div>
        <div style="margin-top:8px;">
            <label>So dien thoai</label>
            <input type="text" th:field="*{phone}">
        </div>
        <div style="margin-top:8px;">
            <label>Avatar URL</label>
            <input type="text" th:field="*{avatarUrl}">
        </div>
        <button style="margin-top:12px;" type="submit">Cap nhat profile</button>
    </form>
</main>
</body>
</html>
