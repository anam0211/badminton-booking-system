<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tạo sân</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 400px;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #0f5132;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #198754;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tạo sân</h1>
        <form th:action="@{/admin/courts}" method="post">
            <input type="hidden" name="branchId" th:value="${branchId}">
            
            <input type="text" name="name" placeholder="Tên sân" required>
            <input type="text" name="type" placeholder="Loại sân" required>

            <select name="status">
                <option value="AVAILABLE">AVAILABLE</option>
                <option value="MAINTENANCE">MAINTENANCE</option>
            </select>

            <button type="submit">Tạo sân</button>
        </form>
        <a th:href="@{/admin/courts(branchId=${branchId})}">⬅ Quay lại</a>
    </div>
</body>
</html>
