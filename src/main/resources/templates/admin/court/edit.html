<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa sân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    
    <style>
        .edit-container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>



<head>
    <title>Sửa sân</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>

<body class="flex h-screen bg-gray-50 overflow-hidden">

<div class="flex-shrink-0"
     th:replace="~{fragments/sidebar :: sidebar('courts')}"></div>

<main class="flex-1 overflow-y-auto p-8">

    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow">

        <h1 class="text-xl font-semibold text-emerald-700 mb-4 text-center">
            Sửa sân
        </h1>

        <form th:action="@{/admin/courts/update/{id}(id=${court.id})}" method="post" class="space-y-4">

            <div>
                <label class="font-medium">Tên sân</label>
                <input type="text" name="name" th:value="${court.name}"
                       class="w-full border p-2 rounded" required>
            </div>

            <div>
                <label class="font-medium">Loại</label>
                <input type="text" name="type" th:value="${court.type}"
                       class="w-full border p-2 rounded" required>
            </div>

            <div>
                <label class="font-medium">Trạng thái</label>
                <select name="status" class="w-full border p-2 rounded">
                    <option value="AVAILABLE"
                        th:selected="${court.status.name() == 'AVAILABLE'}">AVAILABLE</option>
                    <option value="MAINTENANCE"
                        th:selected="${court.status.name() == 'MAINTENANCE'}">MAINTENANCE</option>
                </select>
            </div>

            <button class="w-full bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700">
                Cập nhật
            </button>

        </form>

        <a th:href="@{/admin/courts}"
           class="block text-center mt-4 text-gray-600">
            ⬅ Quay lại
        </a>

    </div>

</main>




<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
