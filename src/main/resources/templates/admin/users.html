<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

<aside id="sidebar"
       class="w-64 bg-white border-r border-gray-200 flex flex-col h-screen shadow-sm z-20 flex-shrink-0 transition-transform duration-300">
    <div class="h-20 flex items-center justify-center border-b border-gray-100">
        <i class="fas fa-shuttlecock text-emerald-600 text-2xl mr-3"></i>
        <span class="text-2xl font-bold text-gray-800 tracking-tighter">Admin Panel</span>
    </div>

    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a th:href="@{/admin/users}" class="sidebar-link active flex items-center px-3 py-2.5 rounded-lg font-medium transition">
            <i class="fas fa-users w-6 text-center mr-3"></i>
            <span>Quản lý người dùng</span>
        </a>

        <!-- <a th:href="@{/admin/dashboard}" class="sidebar-link flex items-center px-3 py-2.5 rounded-lg font-medium transition text-gray-600 hover:bg-gray-50 hover:text-emerald-600">
            <i class="fas fa-chart-line w-6 text-center mr-3"></i>
            <span>Báo cáo doanh thu</span>
        </a> -->
    </nav>

    <div class="p-4 border-t border-gray-100 mt-auto">
        <div th:if="${currentUser != null}" class="space-y-3">
            <div class="flex items-center gap-3 overflow-hidden">
                <img th:src="${'https://ui-avatars.com/api/?background=047857&color=fff&name=' + currentUser.fullName}"
                     class="w-10 h-10 rounded-full flex-shrink-0" alt="Admin Avatar">
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-gray-800 truncate"
                       th:text="${currentUser.fullName}" th:title="${currentUser.fullName}">Tên Admin</p>
                    <p class="text-xs text-gray-500 truncate"
                       th:text="${currentUser.email}" th:title="${currentUser.email}">admin@example.com</p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-2">
                <div class="text-xs px-3 py-2 rounded-lg border border-gray-200 text-gray-700 bg-gray-50">
                    <!-- <p class="font-semibold text-gray-800">Thông tin admin</p> -->
                    <p class="mt-1">
                        Vai trò:
                        <span class="font-medium" th:text="${currentUser.role.name}">ADMIN</span>
                    </p>
                    <p>
                        Trạng thái:
                        <span class="font-medium" th:text="${currentUser.status}">ACTIVE</span>
                    </p>
                </div>
                <a th:href="@{/change-password}"
                   class="text-xs px-3 py-2 rounded-lg border border-emerald-200 text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition text-center">
                    Đổi mật khẩu
                </a>
                <form th:action="@{/logout}" method="post">
                    <button id="btn-logout" type="submit"
                            class="w-full text-xs px-3 py-2 rounded-lg border border-red-200 text-red-600 bg-red-50 hover:bg-red-100 transition cursor-pointer">
                        Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</aside>

<main class="flex-1 overflow-y-auto p-8 relative z-10">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <h1 class="text-2xl font-bold text-gray-800">Quản lý tài khoản</h1>
            <form th:action="@{/admin/users}" method="get" class="flex items-center gap-2">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo email hoặc tên"
                       class="w-72 h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
                <button type="submit"
                        class="h-10 px-4 bg-emerald-600 text-white rounded-lg text-sm hover:bg-emerald-700 transition">
                    Tìm kiếm
                </button>
            </form>
        </div>

        <div th:if="${successMessage}" class="px-4 py-3 rounded-lg bg-emerald-100 text-emerald-800 text-sm" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="px-4 py-3 rounded-lg bg-red-100 text-red-700 text-sm" th:text="${errorMessage}"></div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[980px] text-sm">
                    <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="text-left px-4 py-3 font-semibold">ID</th>
                        <th class="text-left px-4 py-3 font-semibold">Họ tên</th>
                        <th class="text-left px-4 py-3 font-semibold">Email</th>
                        <th class="text-left px-4 py-3 font-semibold">Role</th>
                        <th class="text-left px-4 py-3 font-semibold">Trạng thái</th>
                        <th class="text-left px-4 py-3 font-semibold">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}" class="border-t border-gray-100 hover:bg-gray-50">
                        <td class="px-4 py-3 text-gray-700" th:text="${user.id}">1</td>
                        <td class="px-4 py-3 text-gray-900 font-medium" th:text="${user.fullName}">Nguyen Van A</td>
                        <td class="px-4 py-3 text-gray-700" th:text="${user.email}">email@example.com</td>
                        <td class="px-4 py-3">
                            <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="flex items-center gap-2">
                                <select name="roleName"
                                        class="h-9 border border-gray-300 rounded-lg px-2 text-sm outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
                                    <option th:each="role : ${roleOptions}" th:value="${role}" th:selected="${role.name() == user.role.name}" th:text="${role}">CUSTOMER</option>
                                </select>
                                <button type="submit" class="h-9 px-3 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition text-xs">
                                    Cập nhật
                                </button>
                            </form>
                        </td>
                        <td class="px-4 py-3">
                            <span th:if="${user.status.name() == lockStatus}"
                                  class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-red-100 text-red-700">Đã khóa</span>
                            <span th:unless="${user.status.name() == lockStatus}"
                                  class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-emerald-100 text-emerald-700">Hoạt động</span>
                        </td>
                        <td class="px-4 py-3">
                            <form th:action="@{/admin/users/{id}/toggle-lock(id=${user.id})}" method="post">
                                <button type="submit"
                                        th:text="${user.status.name() == lockStatus ? 'Mở khóa' : 'Khóa tài khoản'}"
                                        th:classappend="${user.status.name() == lockStatus ? ' bg-emerald-600 hover:bg-emerald-700' : ' bg-red-600 hover:bg-red-700'}"
                                        class="h-9 px-3 rounded-lg text-white transition text-xs">
                                    Khóa tài khoản
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="px-4 py-8 text-center text-gray-500">Không tìm thấy tài khoản phù hợp.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
