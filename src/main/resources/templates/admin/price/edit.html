<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa bảng giá</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 80%;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            color: #0f5132;
        }

        .note {
            margin: 16px 0;
            padding: 14px 16px;
            border: 1px solid #cfe2ff;
            border-radius: 12px;
            background: #e7f1ff;
            color: #084298;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #198754;
            color: white;
            padding: 10px;
        }

        td {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        input {
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ddd;
            width: 90%;
            box-sizing: border-box;
        }

        input[readonly] {
            background: #f8f9fa;
            color: #6c757d;
        }

        button {
            padding: 8px 14px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .actions {
            text-align: center;
            margin-top: 15px;
        }

        .empty {
            text-align: center;
            color: #6c757d;
            padding: 20px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Bảng giá - giờ</h1>

    <div class="note">
        Màn này chỉ cập nhật giá trên các khung giờ đang có. Không tạo thêm time slot hoặc giá mới khi bấm cập nhật.
    </div>

    <form th:action="@{/admin/courts/prices/update}" method="post">
        <table id="priceTable">
            <tr>
                <th>Khung giờ</th>
                <th>Bắt đầu</th>
                <th>Kết thúc</th>
                <th>Giá</th>
            </tr>

            <tr th:each="p : ${prices}">
                <td>
                    <input type="hidden" name="priceIds" th:value="${p.id}">
                    <input type="text" th:value="${p.timeSlot.slotName}" readonly>
                </td>
                <td>
                    <input type="time" th:value="${p.timeSlot.startTime}" readonly>
                </td>
                <td>
                    <input type="time" th:value="${p.timeSlot.endTime}" readonly>
                </td>
                <td>
                    <input type="number" min="0" step="1000" name="prices" th:value="${p.price}" required>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(prices)}">
                <td colspan="4" class="empty">Chưa có dữ liệu bảng giá để cập nhật.</td>
            </tr>
        </table>

        <div class="actions">
            <button type="submit">Cập nhật</button>
        </div>
    </form>
</div>
</body>
</html>
