<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý khu vực</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

<aside id="sidebar" th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></aside>

<main class="flex-1 overflow-y-auto p-8 relative z-10">
    <div class="max-w-7xl mx-auto space-y-6">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Quản lý Khu vực</h1>
                <p class="text-sm text-gray-500 mt-1">Quản lý danh sách các khu vực (quận/huyện)</p>
            </div>
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/areas/create}"
                   class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition text-sm font-medium">
                    <i class="fas fa-plus"></i> Thêm khu vực
                </a>
            </div>
        </div>

        <div th:if="${successMessage}" class="px-4 py-3 rounded-lg bg-emerald-100 text-emerald-800 text-sm flex items-center gap-2">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="px-4 py-3 rounded-lg bg-red-100 text-red-700 text-sm flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[600px] text-sm">
                    <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="text-left px-6 py-3 font-semibold">ID</th>
                        <th class="text-left px-6 py-3 font-semibold">Tên khu vực</th>
                        <th class="text-left px-6 py-3 font-semibold">Số chi nhánh</th>
                        <th class="text-left px-6 py-3 font-semibold">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="area : ${areas}" class="border-t border-gray-100 hover:bg-gray-50">
                        <td class="px-6 py-4 text-gray-700 font-medium" th:text="${area.id}">1</td>
                        <td class="px-6 py-4 text-gray-900 font-medium" th:text="${area.name}">Ba Đình</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800"
                                  th:text="${area.branchCount}">5</span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2">
                                <a th:href="@{/admin/areas/edit/{id}(id=${area.id})}"
                                   class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition">
                                    <i class="fas fa-edit text-xs"></i>
                                </a>
                                <form th:action="@{/admin/areas/delete/{id}(id=${area.id})}" method="post"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa khu vực này?');">
                                    <button type="submit"
                                            class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition">
                                        <i class="fas fa-trash text-xs"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(areas)}">
                        <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                            <div class="flex flex-col items-center gap-3">
                                <i class="fas fa-map-marker-alt text-4xl text-gray-300"></i>
                                <p>Chưa có khu vực nào. Hãy thêm khu vực đầu tiên!</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
