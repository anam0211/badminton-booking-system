<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa khu vực</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

<aside id="sidebar" th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></aside>

<main class="flex-1 overflow-y-auto p-8 relative z-10">
    <div class="max-w-2xl mx-auto space-y-6">

        <div class="flex items-center gap-3 text-sm text-gray-500">
            <a th:href="@{/admin/areas}" class="hover:text-emerald-600 transition">
                <i class="fas fa-arrow-left mr-1"></i> Quay lại
            </a>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100">
                <h1 class="text-xl font-bold text-gray-800">Chỉnh sửa khu vực</h1>
                <p class="text-sm text-gray-500 mt-1">Cập nhật thông tin khu vực</p>
            </div>

            <div class="p-6">
                <div th:if="${errorMessage}" class="mb-4 px-4 py-3 rounded-lg bg-red-100 text-red-700 text-sm flex items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/admin/areas/edit/{id}(id=${areaId})}"
                      th:object="${area}"
                      method="post">

                    <div class="space-y-5">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1.5">
                                Tên khu vực <span class="text-red-500">*</span>
                            </label>
                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   placeholder="VD: Ba Đình, Hoàn Kiếm, Đống Đa..."
                                   class="w-full h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                            <p th:if="${#fields.hasErrors('name')}"
                               th:errors="*{name}"
                               class="mt-1 text-xs text-red-500"></p>
                        </div>

                        <div class="pt-2">
                            <button type="submit"
                                    class="w-full h-11 bg-emerald-600 text-white rounded-lg font-medium hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                                <i class="fas fa-save"></i>
                                Cập nhật khu vực
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
