<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa chi nhánh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        .image-preview-item { position: relative; margin-bottom: 8px; }
        .image-preview-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .image-preview-item .remove-btn {
            position: absolute; top: 4px; right: 4px; background: rgba(220,38,38,0.9);
            color: white; border: none; border-radius: 50%; width: 24px; height: 24px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px;
        }
        .existing-image-item { position: relative; margin-bottom: 8px; }
        .existing-image-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 2px solid #006400; }
        .amenity-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #ecfdf5; border: 1px solid #6ee7b7; border-radius: 9999px; font-size: 13px; color: #065f46; }
        .amenity-tag .remove-amenity { cursor: pointer; color: #059669; font-weight: bold; }
        .amenity-tag .remove-amenity:hover { color: #dc2626; }
    </style>
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

<aside id="sidebar" th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></aside>

<main class="flex-1 overflow-y-auto p-8 relative z-10">
    <div class="max-w-4xl mx-auto space-y-6">

        <div class="flex items-center gap-3 text-sm text-gray-500">
            <a th:href="@{/admin/branches}" class="hover:text-emerald-600 transition">
                <i class="fas fa-arrow-left mr-1"></i> Quay lại danh sách
            </a>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100">
                <h1 class="text-xl font-bold text-gray-800">Chỉnh sửa thông tin chi nhánh</h1>
                <p class="text-sm text-gray-500 mt-1">Cập nhật thông tin chi nhánh</p>
            </div>

            <div class="p-6">
                <div th:if="${errorMessage}" class="mb-4 px-4 py-3 rounded-lg bg-red-100 text-red-700 text-sm flex items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/admin/branches/edit/{id}(id=${branchId})}"
                      th:object="${branch}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Tên chi nhánh <span class="text-red-500">*</span>
                                </label>
                                <input type="text" th:field="*{name}" placeholder="VD: Badminton Center Ba Đình"
                                       class="w-full h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-500"></p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Khu vực <span class="text-red-500">*</span>
                                </label>
                                <select th:field="*{areaId}"
                                        class="w-full h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition bg-white">
                                    <option value="">-- Chọn khu vực --</option>
                                    <option th:each="area : ${areas}" th:value="${area.id}" th:text="${area.name}"></option>
                                </select>
                                <p th:if="${#fields.hasErrors('areaId')}" th:errors="*{areaId}" class="mt-1 text-xs text-red-500"></p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Địa chỉ <span class="text-red-500">*</span>
                                </label>
                                <input type="text" th:field="*{address}" placeholder="VD: 123 Đội Cấn, Ba Đình, Hà Nội"
                                       class="w-full h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                                <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="mt-1 text-xs text-red-500"></p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Link Google Maps
                                </label>
                                <input type="text" th:field="*{mapLink}" placeholder="https://maps.google.com/..."
                                       class="w-full h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    Trạng thái
                                </label>
                                <select th:field="*{status}"
                                        class="w-full h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition bg-white">
                                    <option th:each="s : ${statusOptions}" th:value="${s.name()}" th:text="${s.name()}"></option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    <i class="fas fa-user-tie mr-1 text-emerald-600"></i> Branch Admin
                                </label>
                                <select th:field="*{managedBranchAdminId}"
                                        class="w-full h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition bg-white">
                                    <option value="">-- Chưa gán --</option>
                                    <th:block th:if="${currentBranchAdmin != null}">
                                        <option th:value="${currentBranchAdmin.id}"
                                                th:text="${currentBranchAdmin.fullName} + ' (' + ${currentBranchAdmin.email} + ')'"
                                                selected="selected"></option>
                                    </th:block>
                                    <option th:each="admin : ${branchAdminList}" th:value="${admin.id}"
                                            th:text="${admin.fullName} + ' (' + ${admin.email} + ')'"></option>
                                </select>
                                <small class="text-gray-500 text-xs mt-1 block">Chọn người quản lý chi nhánh này</small>
                            </div>
                        </div>

                        <div class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    <i class="fas fa-concierge-bell mr-1 text-emerald-600"></i> Tiện ích / Dịch vụ
                                </label>
                                <div class="flex gap-2 mb-2">
                                    <input type="text" id="amenityInput" placeholder="VD: Wifi miễn phí, Parking..."
                                           class="flex-1 h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                                    <button type="button" id="addAmenityBtn" class="h-10 px-4 bg-emerald-600 text-white rounded-lg text-sm hover:bg-emerald-700 transition">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                                <div id="amenityList" class="flex flex-wrap gap-2 min-h-[40px] p-3 bg-gray-50 rounded-lg border border-gray-200">
                                </div>
                                <div id="amenityInputs"></div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    <i class="fas fa-images mr-1 text-emerald-600"></i> Hình ảnh hiện tại
                                </label>
                                <div id="existingImagesList" class="grid grid-cols-3 gap-3 min-h-[80px] p-3 bg-gray-50 rounded-lg border border-gray-200">
                                    <th:block th:if="${branch.existingImageUrls != null}">
                                        <th:block th:each="img : ${branch.existingImageUrls}">
                                            <div class="existing-image-item">
                                                <img th:src="${img}" alt="Existing image">
                                                <input type="hidden" name="existingImageUrls" th:value="${img}">
                                                <button type="button" class="remove-btn"
                                                        th:onclick="removeExistingImg(this)"
                                                        th:attr="data-img=${img}">&times;</button>
                                            </div>
                                        </th:block>
                                    </th:block>
                                </div>
                                <small class="text-gray-500 text-xs mt-1 block">Ảnh hiện tại (giữ nguyên nếu không thay đổi)</small>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                    <i class="fas fa-cloud-upload-alt mr-1 text-emerald-600"></i> Thay thế / Thêm ảnh mới
                                </label>
                                <div class="mb-2">
                                    <input type="file"
                                           id="imageFilesInput"
                                           name="imageFiles"
                                           multiple
                                           accept="image/*"
                                           class="w-full h-10 border border-gray-300 rounded-lg px-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                                </div>
                                <div id="newImagePreviewList" class="grid grid-cols-3 gap-3 min-h-[120px] p-3 bg-gray-50 rounded-lg border border-gray-200">
                                </div>
                                <small class="text-gray-500 text-xs mt-1 block">Chọn nhiều ảnh. Ảnh mới sẽ thay thế ảnh cũ nếu có.</small>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-gray-100 mt-6">
                        <button type="submit"
                                class="w-full h-12 bg-emerald-600 text-white rounded-lg font-medium hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                            <i class="fas fa-save"></i>
                            Cập nhật chi nhánh
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/sidebar.js}"></script>
<script>
(function() {
    var amenities = [];
    var existingImages = [];
    var newImageFiles = [];

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(String(str)));
        return div.innerHTML;
    }

    function addAmenity() {
        var input = document.getElementById('amenityInput');
        var val = input.value.trim();
        if (val && amenities.indexOf(val) === -1) {
            amenities.push(val);
            renderAmenities();
            input.value = '';
        }
    }

    window.removeAmenity = function(val) {
        var idx = amenities.indexOf(val);
        if (idx > -1) { amenities.splice(idx, 1); renderAmenities(); }
    };

    function renderAmenities() {
        var el = document.getElementById('amenityList');
        var inputsEl = document.getElementById('amenityInputs');
        var html = '';
        for (var i = 0; i < amenities.length; i++) {
            var a = amenities[i];
            var escaped = a.replace(/'/g, "\\'");
            html += '<span class="amenity-tag"><i class="fas fa-check-circle"></i>' + escapeHtml(a) +
                '<span class="remove-amenity" onclick="removeAmenity(\'' + escaped + '\')">&times;</span></span>';
        }
        el.innerHTML = html;
        var inputsHtml = '';
        for (var j = 0; j < amenities.length; j++) {
            inputsHtml += '<input type="hidden" name="amenityNames" value="' + escapeHtml(amenities[j]) + '">';
        }
        inputsEl.innerHTML = inputsHtml;
    }

    window.removeExistingImg = function(btn) {
        var imgUrl = btn.getAttribute('data-img');
        var idx = existingImages.indexOf(imgUrl);
        if (idx > -1) existingImages.splice(idx, 1);
        btn.parentElement.remove();
    };

    function renderExistingImages() {
        var el = document.getElementById('existingImagesList');
        el.innerHTML = '';
    }

    document.getElementById('imageFilesInput').addEventListener('change', function(e) {
        var files = e.target.files;
        for (var i = 0; i < files.length; i++) {
            var file = files[i];
            if (file && file.type.startsWith('image/')) {
                newImageFiles.push(file);
            }
        }
        renderNewImagePreviews();
    });

    function renderNewImagePreviews() {
        var el = document.getElementById('newImagePreviewList');
        el.innerHTML = '';
        for (var i = 0; i < newImageFiles.length; i++) {
            var file = newImageFiles[i];
            var url = URL.createObjectURL(file);
            el.innerHTML +=
                '<div class="image-preview-item">' +
                '<img src="' + url + '" alt="Preview">' +
                '<button type="button" class="remove-btn" onclick="removeNewImage(' + i + ')">&times;</button>' +
                '</div>';
        }
    }

    window.removeNewImage = function(idx) {
        newImageFiles.splice(idx, 1);
        renderNewImagePreviews();
        document.getElementById('imageFilesInput').value = '';
    };

    function initExistingImages() {
        var inputs = document.querySelectorAll('input[name="existingImageUrls"]');
        for (var i = 0; i < inputs.length; i++) {
            existingImages.push(inputs[i].value);
        }
    }

    document.getElementById('addAmenityBtn').addEventListener('click', addAmenity);
    document.getElementById('amenityInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addAmenity(); }
    });

    initExistingImages();
})();
</script>
</body>
</html>
