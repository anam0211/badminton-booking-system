<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<aside th:fragment="sidebar(activePage)" id="sidebar"
       class="w-64 bg-white border-r border-gray-200 flex flex-col h-screen shadow-sm z-20 flex-shrink-0 transition-transform duration-300">

    <div class="h-20 flex items-center justify-center border-b border-gray-100">
        <i class="fas fa-shuttlecock text-emerald-600 text-2xl mr-3"></i>
        <span class="text-2xl font-bold text-gray-800 tracking-tighter">CourtBooking</span>
    </div>

    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">

        <a th:href="@{/admin/dashboard}"
           class="sidebar-link flex items-center px-3 py-2.5 rounded-lg font-medium transition"
           th:classappend="${activePage == 'dashboard' ? 'active' : 'text-gray-600 hover:bg-gray-50 hover:text-emerald-600'}">
            <i class="fas fa-chart-pie w-6 text-center mr-3"></i>
            <span>Tổng quan</span>
        </a>

        <div th:with="isTransaction=${activePage == 'bookings' || activePage == 'payments'}">
            <button onclick="toggleSubmenu('menu-transaction', 'arrow-transaction')"
                    class="sidebar-link w-full flex items-center justify-between px-3 py-2.5 rounded-lg font-medium transition"
                    th:classappend="${isTransaction ? 'active' : 'text-gray-600 hover:bg-gray-50 hover:text-emerald-600'}">
                <div class="flex items-center">
                    <i class="fas fa-file-invoice-dollar w-6 text-center mr-3"></i>
                    <span>Quản lý Giao dịch</span>
                </div>
                <i id="arrow-transaction" class="fas fa-chevron-right text-xs arrow-icon"
                   th:classappend="${isTransaction ? 'open' : ''}"></i>
            </button>
            <div id="menu-transaction" class="submenu pl-12 pr-3 flex flex-col space-y-1 mt-1"
                 th:classappend="${isTransaction ? 'open' : ''}">
                <a th:href="@{/admin/bookings}"
                   class="sidebar-link py-2 text-sm transition"
                   th:classappend="${activePage == 'bookings' ? 'active' : 'text-gray-500 hover:text-emerald-600'}">Lịch
                    đặt sân</a>
                <a th:href="@{/admin/payments}"
                   class="sidebar-link py-2 text-sm transition"
                   th:classappend="${activePage == 'payments' ? 'active' : 'text-gray-500 hover:text-emerald-600'}">Thanh
                    toán</a>
            </div>
        </div>

        <div th:with="isFacility=${activePage == 'branches' || activePage == 'courts'}">
            <button onclick="toggleSubmenu('menu-facility', 'arrow-facility')"
                    class="sidebar-link w-full flex items-center justify-between px-3 py-2.5 rounded-lg font-medium transition"
                    th:classappend="${isFacility ? 'active' : 'text-gray-600 hover:bg-gray-50 hover:text-emerald-600'}">
                <div class="flex items-center">
                    <i class="fas fa-building w-6 text-center mr-3"></i>
                    <span>Cơ sở vật chất</span>
                </div>
                <i id="arrow-facility" class="fas fa-chevron-right text-xs arrow-icon"
                   th:classappend="${isFacility ? 'open' : ''}"></i>
            </button>
            <div id="menu-facility" class="submenu pl-12 pr-3 flex flex-col space-y-1 mt-1"
                 th:classappend="${isFacility ? 'open' : ''}">
                <a th:href="@{/admin/branches}"
                   class="sidebar-link py-2 text-sm transition"
                   th:classappend="${activePage == 'branches' ? 'active' : 'text-gray-500 hover:text-emerald-600'}">Thông
                    tin chi nhánh</a>
                <a th:href="@{/admin/courts}"
                   class="sidebar-link py-2 text-sm transition"
                   th:classappend="${activePage == 'courts' ? 'active' : 'text-gray-500 hover:text-emerald-600'}">Danh
                    sách mặt sân</a>
            </div>
        </div>

        <a th:href="@{/admin/users}"
           class="sidebar-link flex items-center px-3 py-2.5 rounded-lg font-medium transition"
           th:classappend="${activePage == 'users' ? 'active' : 'text-gray-600 hover:bg-gray-50 hover:text-emerald-600'}">
            <i class="fas fa-users w-6 text-center mr-3"></i>
            <span>Khách hàng</span>
        </a>
    </nav>

    <div class="p-4 border-t border-gray-100 mt-auto">

        <div th:if="${currentUser != null}" id="auth-logged-in" class="flex items-center gap-3 overflow-hidden">
            <img id="admin-avatar"
                 th:src="${'https://ui-avatars.com/api/?background=047857&color=fff&name=' + currentUser.fullName}"
                 class="w-10 h-10 rounded-full flex-shrink-0">

            <div class="flex-1 min-w-0">
                <p id="admin-name" class="text-sm font-bold text-gray-800 truncate"
                   th:text="${currentUser.fullName}" th:title="${currentUser.fullName}">
                    Tên Admin
                </p>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="text-xs text-red-500 hover:text-red-700 hover:underline transition cursor-pointer bg-transparent border-none p-0">
                        Đăng xuất
                    </button>
                </form>
            </div>
        </div>

        <div th:if="${currentUser == null}" id="auth-logged-out">
            <a th:href="@{/login}"
               class="flex items-center justify-center w-full gap-2 px-4 py-2.5 text-sm font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-lg transition">
                <i class="fas fa-sign-in-alt"></i>
                <span>Đăng nhập</span>
            </a>
        </div>

    </div>
</aside>
</html>
