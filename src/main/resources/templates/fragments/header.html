<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
<header class="main-header" th:fragment="header">
    <div class="container header-wrapper">

        <a th:href="@{/home}" class="logo">
            BADMINTON
            <i class="fas fa-shuttlecock"></i>
        </a>

        <div class="search-filter-group">
            <form th:action="@{/search}" method="GET" class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" name="keyword" placeholder="Tìm kiếm sân cầu lông...">
            </form>

            <div class="filter-wrapper">
                <button type="button" class="btn-filter" id="btnFilterToggle">
                    <i class="fas fa-filter"></i> Lọc
                </button>

                <div class="filter-dropdown" id="filterDropdown">
                    <form th:action="@{/search}" method="GET" id="filterForm">
                        <input type="hidden" name="keyword" th:value="${param.keyword}">

                        <div class="filter-group">
                            <label><i class="fas fa-map-marker-alt"></i> Khu vực (Hà Nội)</label>
                            <select name="district" class="filter-select">
                                <option value="">Tất cả quận/huyện</option>
                                <option value="Ba Đình">Ba Đình</option>
                                <option value="Hoàn Kiếm">Hoàn Kiếm</option>
                                <option value="Tây Hồ">Tây Hồ</option>
                                <option value="Long Biên">Long Biên</option>
                                <option value="Cầu Giấy">Cầu Giấy</option>
                                <option value="Đống Đa">Đống Đa</option>
                                <option value="Hai Bà Trưng">Hai Bà Trưng</option>
                                <option value="Hoàng Mai">Hoàng Mai</option>
                                <option value="Thanh Xuân">Thanh Xuân</option>
                                <option value="Nam Từ Liêm">Nam Từ Liêm</option>
                                <option value="Bắc Từ Liêm">Bắc Từ Liêm</option>
                                <option value="Hà Đông">Hà Đông</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label><i class="fas fa-money-bill-wave"></i> Mức giá / giờ</label>
                            <select name="priceRange" class="filter-select">
                                <option value="">Mọi mức giá</option>
                                <option value="0-50000">Dưới 50.000đ</option>
                                <option value="50000-100000">50.000đ - 100.000đ</option>
                                <option value="100000-200000">100.000đ - 200.000đ</option>
                                <option value="200000-9999999">Trên 200.000đ</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label><i class="fas fa-star"></i> Đánh giá</label>
                            <select name="rating" class="filter-select">
                                <option value="">Mọi đánh giá</option>
                                <option value="5">5 Sao (Xuất sắc)</option>
                                <option value="4">Từ 4 Sao trở lên</option>
                                <option value="3">Từ 3 Sao trở lên</option>
                            </select>
                        </div>

                        <div class="filter-footer">
                            <button type="button" class="btn-reset" id="btnResetFilter">Xóa lọc</button>
                            <button type="submit" class="btn-apply-filter">Áp dụng</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="right-group">
            <nav class="main-nav">
                <ul>
                    <li><a th:href="@{/services}">Dịch Vụ</a></li>
                    <li><a th:href="@{/my-bookings}">Sân Đã Đặt</a></li>
                    <li><a th:href="@{/contact}">Liên Hệ</a></li>
                </ul>
            </nav>

            <div class="notification-area">

                <div class="notification-bell" id="bellBtn">
                    <i class="fas fa-bell"></i>
                    <span class="dot" id="notiBadge" th:if="${hasUnread}"></span>
                </div>

                <div class="noti-dropdown" id="notiDropdown">
                    <div class="noti-header">
                        <span>Thông báo mới</span>
                        <a href="javascript:void(0)" id="markAllReadBtn"
                           style="font-size: 0.75rem; color: #28a745; text-decoration: none; font-weight: normal;">
                            Đánh dấu đã đọc
                        </a>
                    </div>

                    <div class="noti-list">
                        <p class="empty-noti" th:if="${#lists.isEmpty(notifications)}"
                           style="padding: 15px; text-align: center; color: #666; font-size: 0.85rem; margin: 0;">
                            Không có thông báo nào
                        </p>

                        <th:block th:unless="${#lists.isEmpty(notifications)}">
                            <a th:href="@{/notifications/read/{id}(id=${noti.id})}" class="noti-item"
                               th:each="noti : ${notifications}" th:classappend="${!noti.isRead ? 'unread' : ''}">
                                <h4 th:text="${noti.title}">Tiêu đề</h4>
                                <p th:text="${noti.content}">Nội dung ngắn gọn...</p>
                                <span th:text="${noti.timeDisplay}">25/03/2026 15:30</span>
                            </a>
                        </th:block>
                    </div>

                    <div class="noti-footer">
                        <a th:href="@{/notifications}">Xem tất cả</a>
                    </div>
                </div>

            </div>
            <div class="auth-container">

                <div id="auth-guest" class="auth-box" th:if="${currentUser == null}">
                    <a th:href="@{/login}" class="btn-signin">Đăng nhập</a>
                </div>

                <div id="auth-user" class="auth-box" th:if="${currentUser != null}">
                    <div class="user-profile">
                        <img th:src="${currentUser.avatarUrl != null ? currentUser.avatarUrl : 'https://ui-avatars.com/api/?name=' + currentUser.fullName + '&background=random&color=fff'}"
                             alt="Avatar" class="user-avatar">

                        <span class="user-name" th:text="${currentUser.fullName}">Nguyễn A</span>
                        <i class="fas fa-chevron-down"></i>

                        <ul class="user-dropdown">
                            <li><a th:href="@{/profile}">Tài khoản</a></li>
                            <li><a th:href="@{/history}">Lịch sử</a></li>
                            <li class="divider"></li>

                            <li>
                                <form th:action="@{/logout}" method="post" style="margin: 0;">
                                    <button type="submit" id="btnLogout">
                                        Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script th:src="@{/js/header.js}"></script>
</header>
</body>
</html>
