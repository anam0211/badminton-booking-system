<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        .branch-amenities-section { margin-bottom: 30px; }
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #006400;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title i { color: #006400; }
        .amenities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .amenity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f8fff8;
            border: 1px solid #d1fae5;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .amenity-item:hover {
            background: #ecfdf5;
            border-color: #006400;
            transform: translateY(-1px);
        }
        .amenity-icon {
            width: 36px;
            height: 36px;
            background: #006400;
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .amenity-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
        }
        .amenities-empty {
            text-align: center;
            padding: 30px;
            color: #999;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .amenities-empty i { font-size: 2rem; margin-bottom: 8px; }
    </style>
</head>
<body>

<div th:fragment="branch-amenities(amenities)" class="branch-amenities-section">
    <h2 class="section-title"><i class="fas fa-concierge-bell"></i> Tiện ích & Dịch vụ</h2>

    <div th:if="${not #lists.isEmpty(amenities)}" class="amenities-grid">
        <div th:each="amenity, stat : ${amenities}" class="amenity-item">
            <div class="amenity-icon">
                <i th:class="${stat.index % 5 == 0} ? 'fas fa-wifi' :
                              (${stat.index % 5 == 1} ? 'fas fa-parking' :
                              (${stat.index % 5 == 2} ? 'fas fa-shower' :
                              (${stat.index % 5 == 3} ? 'fas fa-snowflake' : 'fas fa-check')))"></i>
            </div>
            <span class="amenity-name" th:text="${amenity}">Wifi miễn phí</span>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(amenities)}" class="amenities-empty">
        <i class="fas fa-concierge-bell"></i>
        <p>Chưa có thông tin tiện ích</p>
    </div>
</div>

</body>
</html>
